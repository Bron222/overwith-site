<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{if(localStorage.getItem("ow-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
  <title>Page not found · Overwith</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <a class="brand" href="/" aria-label="Overwith home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Overwith
    </a>
    <nav aria-label="Main">
      <a href="/privacy">Privacy</a>
      <a href="/support">Support</a>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch to light mode" hidden>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main id="main" class="page lost">
    <p class="lost-code" aria-hidden="true">404</p>
    <h1>This page didn't get done.</h1>
    <p class="lede">Happens. The link might be old, or the page may have moved on without you.</p>

    <div class="lost-card" aria-hidden="true">
      <span class="lost-check"></span>
      <span>
        Load the page you asked for
        <span class="moved">overdue</span>
      </span>
    </div>

    <div class="lost-actions">
      <a class="btn" href="/">Take me home</a>
      <a class="btn ghost" href="/support">Get help</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Overwith</p>
    <p>
      <a href="/privacy">Privacy Policy</a> ·
      <a href="/support">Support</a> ·
      <a href="mailto:support@overwith.app">support@overwith.app</a>
    </p>
  </footer>
</body>
</html>
